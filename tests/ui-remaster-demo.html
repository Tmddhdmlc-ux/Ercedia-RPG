<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UI REMASTER 반응형 검증</title><style>body{margin:0;background:#101920;color:white;font:18px system-ui}header{padding:12px}button{min-height:44px;padding:10px;margin:3px}iframe{width:var(--demo-width,100%);height:var(--demo-height,85dvh);border:0;display:block;margin:0 auto}output{display:block}</style><header>UI REMASTER 2.0 · 고정 GM 응답 · 실제 세이브와 분리<br><button id="meet">첫 만남·호감도</button><button id="move">개인 의뢰·순찰 이동</button><button id="reunion">3일 후 재회</button><button id="restore">저장 복원</button><button id="mobile">모바일 폭</button><output id="proof">준비 중</output></header><iframe id="game" title="NPC 생활 게임" sandbox="allow-scripts"></iframe><script type="module">
const params=new URLSearchParams(location.search),dimensions={'mobile':[390,844],'small':[360,640],'desktop':[1280,800],'wide':[1920,1080]}[params.get('size')];if(dimensions){document.documentElement.style.setProperty('--demo-width',dimensions[0]+'px');document.documentElement.style.setProperty('--demo-height',dimensions[1]+'px');}
const frame=document.getElementById('game'),token='life-demo',conversation=token;let n=0,saved={version:1,player:{name:'검증 여행자',job:'검사',level:1,hp:100,maxHp:100,mp:100,maxMp:100,xp:0,requiredXp:100,strength:10,dexterity:10,intelligence:10,constitution:10,manaStat:10,skills:[]},chosenName:'검증 여행자',gameState:{date:'1-1-1',region:'W3',place:'솔브린 마을'},inventory:[]};
const send=(type,payload)=>frame.contentWindow.postMessage({channel:'ercedia',token,conversation,type,payload},'*');
const scene=extra=>({schema_version:1,type:'ercedia_scene',scene_id:'life-demo-'+ ++n,location:'솔브린 마을',time:'오후',background_id:'sunny_village_day',npc:{id:'serin',outfit:'armor',emotion:'smile',speaker:'세린'},dialogue:[{speaker:'세린',text:'전에 순찰을 도와주셨던 여행자님이군요. 기억하고 있어요. 오늘은 경비 임무가 있어 멀리 동행하기는 어렵습니다.'}],choices:[{id:'news',text:'최근 마을 소식을 묻는다.'},{id:'goodbye',text:'순찰을 방해하지 않고 작별한다.'}],game_state:{date:saved.gameState?.date||'1-1-1',region:'W3',place:'솔브린 마을'},...extra});
document.getElementById('meet').onclick=()=>{const x=scene({});x.life_events=[{event_id:'life-demo-help',kind:'experience',date:'1-1-1',source_id:'scene:'+x.scene_id,reason:'검증 GM의 실제 도움 판정',npc_id:'serin',action:'마을 순찰 지원',result:'주민 보호를 도왔다',location:'솔브린 마을',affection_delta:20,player_witnessed:true,participants:['serin'],follow_up:'재회 시 협조적인 여행자로 기억'}];send('scene',JSON.stringify(x));};
document.getElementById('move').onclick=()=>{const x=scene({npc:null,background_id:null,dialogue:[{speaker:'나레이션',text:'의뢰를 수락했다. 세린은 경비초소 순찰 임무로 이동한다.'}]});x.quest_updates=[{id:'life-demo-quest',title:'마을 입구 조사',summary:'세린의 순찰 지원 의뢰',type:'investigate',origin:'personal_npc',region_id:'W3',issuer_npc_id:'serin',issuer_name:'세린',rank:'F',status:'offered',objectives:[{id:'clue',description:'현지 단서 확인',target:1,verification:{kind:'clue',target_id:'entry-clue'}}],reward:{xp:0,currency:0,item_ids:[],materials:[],affection_effects:[]}}];x.quest_events=[{event_id:'life-demo-accept',quest_id:'life-demo-quest',kind:'accept',reason:'조건을 듣고 수락 확인'}];x.life_events=[{event_id:'life-demo-move',kind:'move',date:'1-1-1',source_id:'scene:'+x.scene_id,reason:'GM의 실제 순찰 이동',npc_id:'serin',region:'W3',place:'마을 경비초소',activity:'경비'}];send('scene',JSON.stringify(x));};
document.getElementById('reunion').onclick=()=>send('scene',JSON.stringify(scene({location:'마을 경비초소',game_state:{date:'1-1-3',region:'W3',place:'마을 경비초소'}})));
document.getElementById('restore').onclick=()=>send('restore',saved);document.getElementById('mobile').onclick=()=>frame.style.maxWidth=frame.style.maxWidth?'':'390px';
window.addEventListener('message',e=>{const d=e.data;if(e.source!==frame.contentWindow||d?.token!==token)return;if(d.type==='save'){saved=d.payload;document.getElementById('proof').textContent=`호감도 ${saved.relationships?.serin?.affection||0} · 기억 ${saved.npc_life?.memories.length||0} · 활동 ${saved.npc_life?.npcs.serin?.activity||'미확인'} · 위치 ${saved.npc_life?.npcs.serin?.place||'미확인'} · 의뢰 ${saved.quest_log?.[0]?.status||'없음'}`;}if(d.type==='parse-error')document.getElementById('proof').textContent=d.payload.message;if(d.type==='action'){send('action-ack',{requestId:d.payload.requestId});send('scene',JSON.stringify(scene({reply_to:d.payload.requestId,location:saved.gameState.place,game_state:saved.gameState})));}});
frame.srcdoc=(await(await fetch('../integration/game.html')).text()).replace('/*__ERCEDIA_BOOTSTRAP__*/',()=>`window.__ERCEDIA_CONFIG__=${JSON.stringify({token,conversation,saved,assetBase:location.origin+'/'})};window.__ERCEDIA_STORAGE__={getItem:()=>JSON.stringify(window.__ERCEDIA_CONFIG__.saved),setItem:(k,v)=>{window.__ERCEDIA_CONFIG__.saved=JSON.parse(v);parent.postMessage({channel:'ercedia',token:'${token}',conversation:'${conversation}',type:'save',payload:JSON.parse(v)},'*');}};`);
</script></html>
