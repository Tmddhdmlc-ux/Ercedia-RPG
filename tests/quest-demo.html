<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>에르세디아 · 의뢰 통합 검증</title>
<style>body{margin:0;height:100dvh;display:flex;flex-direction:column;background:#101920;color:#eee;font:16px system-ui}header{padding:12px;display:flex;gap:8px;flex-wrap:wrap;flex-shrink:0}button{padding:10px;border:1px solid #edcf96;background:#213540;color:#eee;border-radius:5px;font:16px system-ui;min-height:44px}p{width:100%;margin:0}iframe{width:100%;flex:1;min-height:0;border:0}</style>
<header><strong>의뢰 검증 · GPT 응답은 테스트 데이터 · 실제 세이브와 분리</strong><button id="reset">검증 세이브 초기화</button><button id="offer">개인 의뢰 제시</button><button id="dungeon">실제 던전 진입 기록</button><button id="return">발행자에게 복귀</button><button id="hunt">토벌 의뢰 + 전투</button><button id="fail">실패 판정</button><button id="expire">기한 만료</button><button id="restore">저장 재접속</button><button id="duplicate">보상 중복 시험</button><button id="mobile">모바일 너비</button><p id="result">준비 중</p></header><iframe id="game" title="의뢰 테스트 게임 화면" sandbox="allow-scripts"></iframe>
<script type="module">
import {battleFixture} from './battle-fixtures.js';
const frame=document.getElementById('game'),result=document.getElementById('result'),token='quest-fixture',conversation='quest-fixture';let saved={...battleFixture().state,player:{...battleFixture().state.player,name:'청명'},chosenName:'청명',gameState:{date:'1-1-1',region:'W3',place:'솔브린 마을'}},sequence=0;
const initial=structuredClone(saved);
const q=()=>({id:'demo-personal',title:'잿빛 곡창 입구 조사',summary:'세린이 잿빛 곡창의 입구를 직접 살펴봐 달라고 부탁한다.',origin:'personal_npc',type:'dungeon',status:'offered',rank:'F',region_id:'W3',target_location_id:'DUN-W3-01',issuer_npc_id:'serin',issuer_name:'세린',deadline_at:'1-1-10',objectives:[{id:'entry',description:'잿빛 곡창 입구에 진입한다',target:1,current:0,verification:{kind:'dungeon_enter',target_id:'DUN-W3-01'}}],reward:{xp:14,currency:5,item_ids:['ER-EQ-001'],materials:[],affection_effects:[{npc_id:'serin',delta:2,reason:'조사 약속을 지킴'}]}});
const scene=extra=>({schema_version:1,type:'ercedia_scene',scene_id:'quest-demo-'+ ++sequence,location:'솔브린 마을',time:'오후',background_id:'sunny_village_day',npc:{id:'serin',outfit:'armor',emotion:'smile',speaker:'세린'},dialogue:[{speaker:'세린',text:'곡창 입구를 직접 살펴봐 주실 수 있을까요? 조건은 자유롭게 물어보세요.'}],choices:[{id:'greet',text:'자신을 소개한다.'},{id:'question',text:'조건을 물어본다.'}],...extra});
const send=(type,payload)=>frame.contentWindow.postMessage({channel:'ercedia',token,conversation,type,payload},'*');const apply=extra=>send('scene',JSON.stringify(scene(extra)));
window.addEventListener('message',e=>{const d=e.data;if(e.source!==frame.contentWindow||d?.token!==token)return;if(d.type==='save'){saved=d.payload;result.textContent=`저장: 의뢰 ${saved.quest_log?.length||0} · ${saved.quest_log?.map(q=>q.status+' '+q.objectives[0].current+'/'+q.objectives[0].target).join(', ')||'없음'} · XP ${saved.player.xp} · 재화 ${saved.currency||0} · 보상 ${saved.quest_log?.filter(q=>q.claim_event_id).length||0}회`;}if(d.type==='parse-error')result.textContent='거절된 응답: '+d.payload.message;if(d.type==='restored')result.textContent+=' · 저장 복원 확인';if(d.type==='action'){send('action-ack',{requestId:d.payload.requestId});const text=d.payload.text,found=text.match(/의뢰 \[([^\]]+)\]/),id=found?.[1]||'demo-personal';if(text.includes('게시·연락 창구에'))apply({reply_to:d.payload.requestId,quest_updates:[{...q(),id:'demo-board',title:'현지 게시 의뢰 · 곡창 입구 확인',origin:'guild_board'}]});else{const kind=text.includes('완료 보고')?'report':text.includes('수락하고')?'accept':text.includes('거절합니다')?'decline':text.includes('포기 의사')?'abandon':null;apply({reply_to:d.payload.requestId,...(kind?{quest_events:[{event_id:kind==='report'?'demo-claim-'+id:'demo-event-'+ ++sequence,quest_id:id,kind,reason:'테스트 GM이 조건·실제 증거를 확인함'}]}:{dialogue:[{speaker:'세린',text:'질문을 들었습니다. 실제 게임에서는 GPT가 사정에 맞춰 답합니다.'}]})});}}});
document.getElementById('reset').onclick=()=>{saved=structuredClone(initial);send('restore',saved);};
document.getElementById('offer').onclick=()=>apply({quest_updates:[q()]});
document.getElementById('dungeon').onclick=()=>apply({location:'DUN-W3-01',npc:null,background_id:null,game_state:{place:'DUN-W3-01'},world_events:[{event_id:'demo-entry-'+ ++sequence,kind:'dungeon_enter',target_id:'DUN-W3-01',location:'DUN-W3-01',proof:'검증용 실제 던전 진입 사건'}],dialogue:[{speaker:'나레이션',text:'잿빛 곡창의 입구에 도착했다. 의뢰 목표가 기록된다.'}]});
document.getElementById('return').onclick=()=>apply({game_state:{place:'솔브린 마을'},dialogue:[{speaker:'세린',text:'확인한 내용을 보고해주세요.'}]});
document.getElementById('fail').onclick=()=>apply({quest_events:[{event_id:'demo-fail-'+ ++sequence,quest_id:saved.quest_log?.find(q=>['accepted','active','ready_to_report'].includes(q.status))?.id||'demo-personal',kind:'fail',reason:'검증용 실제 실패 사건'}]});
document.getElementById('expire').onclick=()=>apply({game_state:{date:'1-1-11'}});
document.getElementById('restore').onclick=()=>{send('restore',saved);};
document.getElementById('duplicate').onclick=()=>apply({quest_events:[{event_id:'demo-claim-demo-personal',quest_id:'demo-personal',kind:'report',reason:'중복 보상 시험'}]});
document.getElementById('hunt').onclick=()=>{const f=battleFixture(),hunt={...q(),id:'demo-hunt',title:'전투 결과 확인 의뢰',type:'hunt',objectives:[{id:'hunt',description:'실제 상대 전투불능 확인',target:1,current:0,verification:{kind:'battle_win',target_id:'serin'}}],reward:{xp:0,currency:0,item_ids:[],materials:[],affection_effects:[]}};saved={...f.state,player:{...f.state.player,name:'청명'},quest_log:[{...hunt,status:'active'}],gameState:{date:'1-1-1',region:'W3',place:'솔브린 마을'}};send('restore',saved);send('scene',JSON.stringify(f.scene));};
document.getElementById('mobile').onclick=()=>{frame.style.maxWidth=frame.style.maxWidth?'':'390px';frame.style.margin='0 auto';};
const config={token,conversation,saved,assetBase:location.origin+'/'};const bootstrap=`window.__ERCEDIA_CONFIG__=${JSON.stringify(config)};window.__ERCEDIA_STORAGE__={getItem:()=>JSON.stringify(window.__ERCEDIA_CONFIG__.saved),setItem:(key,value)=>{const s=JSON.parse(value);window.__ERCEDIA_CONFIG__.saved=s;parent.postMessage({channel:'ercedia',token:'${token}',conversation:'${conversation}',type:'save',payload:s},'*');}};`;frame.srcdoc=(await(await fetch('../integration/game.html')).text()).replace('/*__ERCEDIA_BOOTSTRAP__*/',()=>bootstrap);result.textContent='타이틀에서 불러오기를 누른 뒤 검증 버튼을 사용하세요.';
</script></html>
