<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>에르세디아 · 원소 이펙트 12종 시안</title><link rel="stylesheet" href="elemental-vfx-preview.css"></head><body>
<header><div><strong>원소 이펙트 · 12종 시안</strong><span>정면 카메라 · 응축·곡선·낙하·지면 발동 · 속도감 개선 시안</span></div><a href="battle-effects-preview.html?view=first-person">기존 70종과 비교</a></header>
<main><section id="stage" aria-label="정면 시점 원소 이펙트 미리보기">
<img class="background" src="../assets/locations/towns/sunny_village/town_day.png" alt=""><div class="shade"></div>
<div class="hud"><article><strong>주인공 · 정면 시점</strong><span id="mana-text">MP 100 / 100</span><progress id="mana" max="100" value="100" aria-label="연출용 마나"></progress></article><article><strong>세린 · 연출용 상대</strong><span id="health-text">HP 100 / 100</span><progress id="health" max="100" value="100" aria-label="연출용 체력"></progress></article></div>
<img id="enemy" src="../assets/characters/main/serin/standing/base.png" alt="세린의 기존 갑옷 스탠딩">
<canvas id="vfx" aria-hidden="true"></canvas><div id="skill" aria-hidden="true"></div><div id="damage" aria-hidden="true"></div>
<div class="commentary"><strong id="name">원소 이펙트</strong><span id="phase">준비</span><p id="description" aria-live="polite">아래에서 기술을 선택하세요.</p></div>
</section>
<section class="controls"><div id="samples" role="group" aria-label="원소별 기술 선택"></div><div class="playback"><button id="play">▶ 다시 재생</button><button id="pause">일시정지</button><button id="next">다음 기술 →</button><label>속도 <select id="speed"><option value="0.5">0.5배</option><option value="1" selected>1배</option><option value="2">2배</option></select></label><label><input id="loop" type="checkbox"> 연속 재생</label><label><input id="original" type="checkbox"> 이전 시안 비교</label><button id="fullscreen">전체화면</button><span id="status" role="status"></span></div><p class="note">승인 전 미리보기입니다. 원본 기술명·설명은 GitHub 설정을 사용하며 피해량은 연출용 예시입니다. 게임·세이브와 연결되지 않습니다.</p></section></main>
<script type="module" src="elemental-vfx-preview.js"></script></body></html>
