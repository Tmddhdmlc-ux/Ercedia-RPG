<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>순차 엔진 패치 검증</title>
<style>body{margin:0;background:#101820;color:#F0EDE5;font:16px system-ui}header{padding:12px}button{min-height:44px;margin:3px;padding:8px}iframe{display:block;width:100%;height:800px;border:0}output{display:block;font-size:15px}</style>
<header>순차 패치 · 고정 GM 검증 · 실제 채팅/세이브와 분리<br><button id="loot">마수 토벌·전리품</button><button id="enter">던전 발견·입장</button><button id="resolve">현재 구역 해결</button><button id="advance">다음 구역</button><button id="quote">상점 견적</button><button id="buy">구매</button><button id="sell">판매</button><button id="auction">경매 개설·입찰</button><button id="settle">경매 마감</button><button id="month">다음 달</button><button id="restore">저장 복원</button><output id="proof">준비 중</output></header>
<iframe id="game" title="순차 패치 게임" sandbox="allow-scripts"></iframe><script type="module">
import {initialPlayer} from '../web/intro-model.js';import {emptyWorld} from '../web/world-engine.js';import {ensureEngine,recalculateEquipment} from '../web/engine-model.js';import {worldData} from '../web/world-data.js';import {confirmedMonsterBattle} from './world-fixtures.js';
const frame=document.getElementById('game'),token='ordered-demo',conversation=token,d=worldData.dungeons[0];let n=0,saved={version:1,chosenName:'검증 여행자',player:initialPlayer('검증 여행자'),inventory:[],gameState:{date:'1-1-1',region:'W1',place:'검증 장터'},currency:1000};saved.player.job='검사';saved.world_engine=emptyWorld(saved);ensureEngine(saved);recalculateEquipment(saved);
const ev=(kind,extra={})=>({event_id:'demo-event-'+ ++n,kind,reason:'합성 GM의 고정 결과. 실제 ChatGPT 판정 아님.',...extra});
const make=(events=[],extra={})=>({schema_version:1,type:'ercedia_scene',scene_id:'demo-scene-'+ ++n,location:saved.gameState.place,time:'오후',background_id:null,npc:null,dialogue:[{speaker:'나레이션',text:'검증 GM이 확인한 결과를 반영했습니다.'}],choices:[],game_state:{...saved.gameState},system_events:events,...extra});
const send=(type,payload)=>frame.contentWindow.postMessage({channel:'ercedia',token,conversation,type,payload},'*');const present=s=>send('scene',JSON.stringify(s));
document.getElementById('loot').onclick=()=>{const b=confirmedMonsterBattle(saved,{battleId:'demo-loot-'+ ++n,items:[{id:'MAT-001-1',quantity:1}]});delete b.instanceId;present(make([ev('loot',{battle_id:b.battle.battle_id,monster_id:'ER-NPC-081',participant_id:b.battle.participants[1].id,items:[{id:'MAT-001-1',quantity:1}]})],b));};
document.getElementById('enter').onclick=()=>present(make([ev('discover_dungeon',{dungeon_id:d.id}),ev('enter_dungeon',{dungeon_id:d.id,run_id:'demo-run'})],{location:d.id,game_state:{...saved.gameState,place:d.id}}));
document.getElementById('resolve').onclick=()=>{const run=saved.world_engine.dungeons[d.id],zone=d.zones.find(z=>z.id===run?.zone_id);if(!zone)return;
if(zone.type==='entrance'){const proof={event_id:'proof-'+ ++n,kind:'action',target_id:zone.id,location:d.id,proof:'검증 GM의 실제 입구 정찰 사건'};present(make([ev('resolve_zone',{dungeon_id:d.id,zone_id:zone.id,evidence_id:proof.event_id})],{world_events:[proof]}));}
else {const boss=zone.type==='boss',b=confirmedMonsterBattle(saved,{battleId:'demo-zone-'+ ++n,xp:boss?93:0,items:boss?[{id:'MAT-001-1',quantity:1}]:[]});delete b.instanceId;present(make([ev('resolve_zone',{dungeon_id:d.id,zone_id:zone.id,battle_id:b.battle.battle_id}),...(boss?[ev('clear_dungeon',{dungeon_id:d.id,battle_id:b.battle.battle_id,material_id:'MAT-001-1'})]:[])],b));}};
document.getElementById('advance').onclick=()=>{const run=saved.world_engine.dungeons[d.id],zone=d.zones.find(z=>!run?.resolved.includes(z.id));if(zone)present(make([ev('enter_zone',{dungeon_id:d.id,zone_id:zone.id})]));};
const quote=()=>({id:'demo-quote',type:'shop',venue_id:'test-market',venue_name:'검증 장터',region_id:'W1',valid_until:'1-2-30',items:[{id:'ER-EQ-001',stock:3,buy_price:100,sell_price:40,price_basis:'고정 GM 검증 전용 가격. 세계관 가격 아님.'}]});
document.getElementById('quote').onclick=()=>present(make([ev('offer',{offer:quote()})],{location:'검증 장터',game_state:{...saved.gameState,place:'검증 장터'}}));
for(const[id,direction]of [['buy','buy'],['sell','sell']])document.getElementById(id).onclick=()=>present(make([ev('trade',{offer_id:'demo-quote',item_id:'ER-EQ-001',quantity:1,direction})]));
document.getElementById('auction').onclick=()=>present(make([ev('auction',{auction:{id:'demo-auction',item_id:'ER-EQ-001',venue_id:'test-market',venue_name:'검증 장터',region_id:'W1',reserve:50,closes_at:'1-1-2',price_basis:'합성 GM의 검증 경매 가격',eligible:true}}),ev('bid',{auction_id:'demo-auction',amount:70})]));
document.getElementById('settle').onclick=()=>present(make([ev('auction_result',{auction_id:'demo-auction',result:'won',final_price:70,authenticity_proof:'합성 GM 검증의 진품 확인'})],{game_state:{...saved.gameState,date:'1-1-2'}}));
document.getElementById('month').onclick=()=>present(make([],{game_state:{...saved.gameState,date:'1-2-1'}}));document.getElementById('restore').onclick=()=>send('restore',saved);
window.addEventListener('message',e=>{const m=e.data;if(e.source!==frame.contentWindow||m?.token!==token)return;if(m.type==='save'){saved=m.payload;document.getElementById('proof').textContent=`Lv.${saved.player.level} · XP ${saved.player.xp} · 재화 ${saved.currency||0} · 가방 ${saved.inventory.map(i=>i.id+':'+i.quantity).join(', ')} · 던전 해결 ${saved.world_engine?.dungeons[d.id]?.resolved.length||0} · 최초 보상 ${saved.world_engine?.dungeons[d.id]?.claimed||false} · 정산 ${saved.battleApplied?.length||0} · 날짜 ${saved.gameState.date}`;}if(m.type==='parse-error')document.getElementById('proof').textContent=m.payload.message;if(m.type==='action'){send('action-ack',{requestId:m.payload.requestId});present(make([],{reply_to:m.payload.requestId,dialogue:[{speaker:'나레이션',text:'입력 전달 검증 완료. 기능별 판정은 위쪽 고정 GM 버튼으로 재현합니다.'}]}));}});
frame.srcdoc=(await(await fetch('../integration/game.html')).text()).replace('/*__ERCEDIA_BOOTSTRAP__*/',()=>`window.__ERCEDIA_CONFIG__=${JSON.stringify({token,conversation,saved,assetBase:location.origin+'/'})};window.__ERCEDIA_STORAGE__={getItem:()=>JSON.stringify(window.__ERCEDIA_CONFIG__.saved),setItem:(k,v)=>{window.__ERCEDIA_CONFIG__.saved=JSON.parse(v);parent.postMessage({channel:'ercedia',token:'${token}',conversation:'${conversation}',type:'save',payload:JSON.parse(v)},'*');}};`);
</script></html>
