<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>에르세디아 · 자동전투 관전 데모</title>
<style>body{height:100dvh;display:flex;flex-direction:column;overflow:hidden;margin:0;background:#101920;color:#eee;font:16px system-ui}header{flex-shrink:0;padding:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}button,select{padding:10px;background:#213540;color:#eee;border:1px solid #ad9874;border-radius:5px;font:16px system-ui;min-height:44px}iframe{width:100%;flex:1;min-height:0;border:0}#result{width:100%;margin:0;font-size:14px}</style>
<header><strong>연출 데모 · 실제 GPT 판정 아님</strong><select id="scenario" aria-label="검증 시나리오"><option value="dialogue">대화 중 적대</option><option value="travel">이동 중 도적 습격</option><option value="dungeon">던전 마수 조우</option><option value="duel">정식 결투</option><option value="ambush">기습·마법 공격</option><option value="unique">하이퍼 컷인 검증</option></select><button id="start">데모 전투 시작</button><button id="preview-slash">베기 소리 듣기</button><button id="preview-critical">치명타 소리 듣기</button><span class="ui-preview-controls"></span><span id="sword-preview-status" role="status"></span><button id="magic-preview">시전 구간 확인</button><button id="reload-save">세이브 복원</button><button id="invalid">오류 복구 시험</button><p id="result">검증 준비 중</p></header>
<iframe id="game" title="전투 관전 게임 화면" sandbox="allow-scripts"></iframe>
<script type="module">
import {mountUIAudio} from '../web/ui-audio.js';
import {createBattleAudio} from '../web/battle-audio.js';
import {battleFixture,serinCanonFixture} from './battle-fixtures.js';
import {normalizeScene} from '../web/scene.js';
const frame=document.getElementById('game'),result=document.getElementById('result'),token='local-battle-demo',conversation='battle-demo';let saved=battleFixture().state,applied=0;
const canonical=v=>Array.isArray(v)?'['+v.map(canonical).join(',')+']':v&&typeof v==='object'?'{'+Object.keys(v).sort().map(k=>JSON.stringify(k)+':'+canonical(v[k])).join(',')+'}':JSON.stringify(v);
const send=(type,payload)=>{if(type==='restore'){saved=payload;result.textContent=`데모 복원: HP ${saved.player.hp}, MP ${saved.player.mp}, XP ${saved.player.xp}, 정산 ${saved.battleApplied?.length||0}회`;}frame.contentWindow.postMessage({channel:'ercedia',token,conversation,type,payload},'*');};
window.addEventListener('message',event=>{const d=event.data;if(event.source!==frame.contentWindow||d?.token!==token)return;if(d.type==='save'){saved=d.payload;result.textContent=`데모 저장: HP ${saved.player.hp}, MP ${saved.player.mp}, XP ${saved.player.xp}, 아이템 ${saved.inventory.map(i=>i.quantity).join(',')||0}, 정산 ${saved.battleApplied?.length||0}회 · 재생 ${saved.battlePlayback?.index??0}`;}if(d.type==='restored')result.textContent+=' · 복원 '+(canonical(d.payload.state)===canonical(saved)?'통과':'실패');if(d.type==='boot-error'||d.type==='parse-error')result.textContent+=' · '+JSON.stringify(d.payload);});
mountUIAudio(document.body,{assetBase:location.origin+'/'});
const swordPreview=createBattleAudio({assetBase:location.origin+'/'});
for(const [id,cue] of [['preview-slash','hit'],['preview-critical','critical']])document.getElementById(id).onclick=async()=>{swordPreview.setMuted(false);swordPreview.stop();const ok=await swordPreview.unlock();if(ok)swordPreview.play({kind:'attack',result:cue,damage:1});document.getElementById('sword-preview-status').textContent=ok?(cue==='hit'?'일반 베기 재생':'치명타 베기 재생'):'음원 준비 실패 · 다시 눌러주세요';};
document.getElementById('start').onclick=()=>{const fixture=battleFixture(document.getElementById('scenario').value);send('restore',fixture.state);send('scene',JSON.stringify(fixture.scene));};
const canonButton=document.createElement('button');canonButton.textContent='세린 등록 수치 검증';document.querySelector('header').append(canonButton);canonButton.onclick=()=>{const f=serinCanonFixture();send('restore',f.state);send('scene',JSON.stringify(f.scene));};
document.getElementById('reload-save').onclick=()=>send('restore',saved);
document.getElementById('magic-preview').onclick=()=>{const f=battleFixture();send('restore',{...f.state,battleApplied:[],battlePlayback:{scene:normalizeScene(f.scene),index:3,speed:.5,paused:true,done:false,replay:false}});};
document.getElementById('invalid').onclick=()=>{const fixture=battleFixture();fixture.scene.battle.events[0].damage=5;send('restore',fixture.state);send('scene',JSON.stringify(fixture.scene));};
const config={token,conversation,saved,assetBase:location.origin+'/'};
const bootstrap=`window.__ERCEDIA_CONFIG__=${JSON.stringify(config)};window.__ERCEDIA_STORAGE__={getItem:()=>JSON.stringify(window.__ERCEDIA_CONFIG__.saved),setItem:(key,value)=>{const state=JSON.parse(value);window.__ERCEDIA_CONFIG__.saved=state;parent.postMessage({channel:'ercedia',token:'${token}',conversation:'${conversation}',type:'save',payload:state},'*');}};`;
frame.srcdoc=(await (await fetch('../integration/game.html')).text()).replace('/*__ERCEDIA_BOOTSTRAP__*/',bootstrap);result.textContent='데모는 실제 채팅 세이브와 분리됩니다. 시작 버튼을 누르세요.';
</script></html>
