<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>에르세디아 · 게임 시간 미리보기</title><link rel="stylesheet" href="../web/style.css"><style>body{padding:24px}.game{max-width:1400px;margin:auto}header{padding:16px}header p{color:#b8c8d5}nav{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}nav button{font-size:18px}.stage{height:65vh;min-height:400px}.preview-person{position:absolute;inset:10% 0 0 55%;width:35%;height:90%;object-fit:contain;pointer-events:none}.preview-caption{position:absolute;bottom:20px;left:20px;right:20px;padding:16px;background:#0b182ce8;font-size:20px;z-index:2}</style></head>
<body><div class="game" data-title="closed" data-intro-phase="none"><header><h1>게임 시간과 배경 분위기</h1><p>시간대를 눌러 비교하세요. 예시 날짜·시간이며 실제 저장과 게임 진행에는 영향을 주지 않습니다.</p><nav id="phases"></nav><span id="hud-game-time" class="hud-game-time"></span></header><div id="stage" class="stage"><img id="background" class="background" data-background-id="sunny_village_day" src="../assets/locations/towns/sunny_village/town_day.png" alt="등록된 마을 배경"><img class="preview-person" src="../assets/characters/main/serin/standing/base.png" alt="세린의 등록된 스탠딩"><div id="time-notice" class="time-notice" role="status" hidden></div><div class="preview-caption">배경만 시간대에 따라 바뀝니다. 인물과 글씨의 밝기는 유지합니다.</div></div></div>
<script type="module">import {mountGameTime} from '../web/game-time.js';const state={campaign_id:'time-preview',gameState:{date:'1-01-01',time:'14:00'}},ui=mountGameTime(state);for(const [label,time] of [['새벽','05:00'],['아침','09:00'],['낮','14:00'],['저녁','18:40'],['밤','22:00']]){const b=document.createElement('button');b.textContent=label+' '+time;b.onclick=()=>{state.gameState.time=time;ui.render();};document.getElementById('phases').append(b);}ui.render();</script></body></html>
