<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>에르세디아 엔진 검증</title><style>body{margin:0;background:#101920;color:white;font:18px system-ui}header{padding:12px}button{padding:12px;margin:5px}iframe{width:100%;height:85dvh;border:0}#result{white-space:pre-wrap}</style><header>엔진 검증 · 고정 GM 테스트 응답 · 실제 세이브와 분리 <button id="xp">경험치 110 확인</button><button id="restore">저장 복원</button><button id="mobile">모바일</button><output id="result">준비 중</output></header><iframe id="game" sandbox="allow-scripts" title="엔진 게임"></iframe><script type="module">
const f=document.getElementById('game'),token='engine-fixture',conversation=token;let serial=0,saved={version:1,player:{name:'청명',job:'검사',level:1,hp:80,maxHp:100,mp:90,maxMp:100,xp:0,requiredXp:100,strength:10,dexterity:10,intelligence:10,constitution:10,manaStat:10,realm:'none',levelHpBonus:0,unspentStatPoints:0,skills:[]},chosenName:'청명',inventory:[{id:'ER-EQ-001',name:'수습의 낡은 철검',category:'equipment',quantity:1},{id:'BK-SWD-001',name:'기초 횡베기 검술서',category:'misc',quantity:1}],gameState:{region:'W3',date:'1-1-1'}};
if(new URLSearchParams(location.search).has('intro'))saved.introDraft={step:'name',name:'',answers:{},previousView:{page:'story',mapView:'world',region:'village'}};
if(new URLSearchParams(location.search).has('old')){saved.player.hp=32;saved.player.xp=74;saved.player.level=5;}
const send=(type,payload)=>f.contentWindow.postMessage({channel:'ercedia',token,conversation,type,payload},'*');const scene=extra=>({schema_version:1,type:'ercedia_scene',scene_id:'engine-demo-'+ ++serial,location:'솔브린 마을',time:'오후',background_id:'sunny_village_day',npc:{id:'serin',outfit:'armor',emotion:'smile',speaker:'세린'},dialogue:[{speaker:'세린',text:'엔진 검증 장면입니다.'}],choices:[],...extra});
window.addEventListener('message',event=>{const d=event.data;if(event.source!==f.contentWindow||d?.token!==token)return;if(d.type==='save'){saved=d.payload;document.getElementById('result').textContent=`Lv.${saved.player.level} · XP ${saved.player.xp} · 포인트 ${saved.player.unspentStatPoints} · 체질 ${saved.player.constitution} · HP ${saved.player.hp}/${saved.player.maxHp} · 장착 ${JSON.stringify(saved.engine?.equipped||{})} · 기술 ${saved.player.skills.length}`;}if(d.type==='parse-error')document.getElementById('result').textContent=d.payload.message;if(d.type==='action'){send('action-ack',{requestId:d.payload.requestId});send('scene',JSON.stringify(scene({reply_to:d.payload.requestId,...(saved.intro_completed?{location:saved.gameState.place,background_id:null,npc:null,dialogue:[{speaker:'나레이션',text:'새 게임 첫 장면. 기존 청명의 진행 기록은 사용하지 않습니다.'}]}:{engine_events:[{event_id:'learn-demo',kind:'learn_book',catalog_id:'BK-SWD-001',reason:'테스트 GM 실제 읽기·연습 확인'}]})})));}});
document.getElementById('xp').onclick=()=>send('scene',JSON.stringify(scene({engine_events:[{event_id:'xp-demo',kind:'xp',amount:110,reason:'테스트 GM 수련 확인'}]})));document.getElementById('restore').onclick=()=>send('restore',saved);document.getElementById('mobile').onclick=()=>{f.style.maxWidth=f.style.maxWidth?'':'390px';};const config={token,conversation,saved,assetBase:location.origin+'/'};f.srcdoc=(await(await fetch('../integration/game.html')).text()).replace('/*__ERCEDIA_BOOTSTRAP__*/',()=>`window.__ERCEDIA_CONFIG__=${JSON.stringify(config)};window.__ERCEDIA_STORAGE__={getItem:()=>JSON.stringify(window.__ERCEDIA_CONFIG__.saved),setItem:(k,v)=>{window.__ERCEDIA_CONFIG__.saved=JSON.parse(v);parent.postMessage({channel:'ercedia',token:'${token}',conversation:'${conversation}',type:'save',payload:JSON.parse(v)},'*');}};`);
</script></html>
