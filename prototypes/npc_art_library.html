<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>에르세디아 · 캐릭터와 깃발 검수</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101a28;color:#ebedf4;font:16px system-ui,sans-serif}main{max-width:1360px;margin:auto;padding:24px}h1{font-size:25px}p{color:#c0cbdc;line-height:1.6}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}select,button,input{font:inherit;padding:12px;border-radius:10px;background:#26344d;color:white;border:1px solid #60718c;min-height:44px}button[aria-pressed=true]{background:#795d32}.grid{display:grid;grid-template-columns:2fr 1fr;gap:18px}.stage{position:relative;height:650px;border-radius:18px;overflow:hidden;background:repeating-conic-gradient(#26354b 0% 25%,#31415a 0% 50%) 50%/24px 24px}.background{position:absolute;width:100%;height:100%;object-fit:cover}.actor{position:absolute;height:100%;width:auto;left:50%;transform:translateX(-50%);bottom:0;max-width:none}.stage.vn .actor{height:220%;bottom:-120%}.stage.monster .actor{height:auto;width:88%;max-height:80%;object-fit:contain;bottom:12%}.dialogue{position:absolute;bottom:16px;left:16px;right:16px;border:1px solid #cbb580;border-radius:12px;background:#142034ed;padding:18px;z-index:2}.dialogue strong{color:#f0d7a0}.dialogue p{margin:8px 0;color:white}.portrait{width:100%;height:580px;object-fit:contain;background:repeating-conic-gradient(#25344b 0% 25%,#31415a 0% 50%) 50%/24px 24px;border-radius:18px}.meta{font-size:14px}.flags{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.flag{background:#26344a;border-radius:12px;padding:12px}.flag img{width:100%;aspect-ratio:1.5;object-fit:contain}.flag p{margin:5px 0;font-size:14px}a{color:#ddc38b}.source{display:flex;gap:16px;margin:12px 0}#errors{color:#ffb8a9}[hidden]{display:none!important}@media(max-width:700px){main{padding:12px}.grid{grid-template-columns:1fr}.stage{height:550px}.portrait{height:420px}.flags{grid-template-columns:repeat(2,1fr)}}
</style>
<main><h1>캐릭터 원화 · 왕국과 영주 깃발</h1><p id="progress">제작 목록을 불러오는 중입니다.</p><p>신규 디자인 시안 · 기본 표정만 제작. 최종 검수 전이며 기존 게임 장면에는 자동 적용하지 않았습니다.</p>
<div class="toolbar"><button id="characters" aria-pressed="true">캐릭터</button><button id="heraldry" aria-pressed="false">국기·영주 깃발</button></div>
<section id="character-panel"><div class="toolbar"><input id="search" aria-label="캐릭터 이름 또는 ID 검색" placeholder="이름·ID·소속 검색"><select id="character" aria-label="캐릭터 선택"></select><button id="vn" aria-pressed="false">대화 구도</button><button id="full" aria-pressed="true">전신 확인</button><button id="serin" aria-pressed="false">세린과 비교</button></div>
<div class="grid"><section><div class="stage" id="stage"><img class="background" id="background" src="../assets/locations/towns/sunny_village/town_day.png" alt="대화 장면 참고 배경"><img class="actor" id="actor" alt="캐릭터 전신"><div class="dialogue"><strong id="name"></strong><p>기본형 원화 검수 · 대사는 작성하지 않았습니다.</p></div></div><p id="meta" class="meta"></p></section><section><img class="portrait" id="portrait" alt="캐릭터 기본 초상화"><div class="source"><a id="standing-link">전신 PNG</a><a id="portrait-link">초상화 PNG</a></div><p id="errors" role="status"></p></section></div></section>
<section id="flag-panel" hidden><div class="flags" id="flags"></div></section></main>
<script type="module">
const $=id=>document.getElementById(id);let compare=false;let rows=[];
const batches=await Promise.all([...Array.from({length:10},(_,i)=>'batch_'+String(i+1).padStart(2,'0')),...Array.from({length:4},(_,i)=>'core_batch_'+String(i+1).padStart(2,'0'))].map(batch=>fetch('../assets/characters/batches/'+batch+'/manifest.json').then(r=>r.ok?r.json():null).catch(()=>null)));
for(const b of batches.filter(Boolean))for(const p of b.characters)if(p.assets.portrait&&(p.category==='마수'||p.assets.standing))rows.push(p);
rows.sort((a,b)=>a.id.localeCompare(b.id));
const flags=await fetch('../assets/heraldry/manifest.json').then(r=>r.ok?r.json():{flags:[]}).catch(()=>({flags:[]}));
$('progress').textContent=`기본형 세트 ${rows.length}/138명 · 깃발 ${flags.flags.length}/16종. 마수는 투명 초상화 중심으로 표시합니다.`;
function options(){const old=$('character').value;const q=$('search').value.trim().toLowerCase();$('character').replaceChildren();for(const p of rows.filter(p=>(p.id+' '+p.name+' '+p.affiliation).toLowerCase().includes(q))){const o=document.createElement('option');o.value=p.id;o.textContent=p.id+' · '+p.name;$('character').append(o)}if([...$('character').options].some(o=>o.value===old))$('character').value=old;render()}
function render(){const p=rows.find(p=>p.id===$('character').value);if(!p){$('name').textContent='해당하는 완성 자산이 없습니다';$('actor').hidden=true;$('portrait').hidden=true;return}const monster=p.category==='마수'&&!compare;$('actor').hidden=false;$('portrait').hidden=false;$('stage').classList.toggle('monster',monster);$('background').hidden=monster;$('vn').disabled=monster;$('actor').src='../'+(compare?'assets/characters/main/serin/standing/base.png':(p.assets.standing||p.assets.portrait).path);$('actor').alt=compare?'세린 기준 전신':p.name+(monster?' 마수 초상화':' 전신');$('portrait').src='../'+(compare?'assets/characters/main/serin/base_transparent.png':p.assets.portrait.path);$('portrait').alt=compare?'세린 기준 초상화':p.name+' 초상화';$('name').textContent=compare?'세린 · 기준 원화':p.name+' · '+p.affiliation;$('meta').textContent=p.id+' · '+(p.rank||'기본형')+' · RGBA · 디자인 검수 대기';$('standing-link').hidden=!p.assets.standing;$('standing-link').href='../'+(p.assets.standing||p.assets.portrait).path;$('portrait-link').href='../'+p.assets.portrait.path;$('errors').textContent=''}
function selectCharacter(){compare=false;$('serin').setAttribute('aria-pressed','false');render()}
$('search').oninput=options;$('character').onchange=selectCharacter;$('vn').onclick=()=>{$('stage').classList.add('vn');$('vn').setAttribute('aria-pressed','true');$('full').setAttribute('aria-pressed','false')};$('full').onclick=()=>{$('stage').classList.remove('vn');$('vn').setAttribute('aria-pressed','false');$('full').setAttribute('aria-pressed','true')};$('serin').onclick=()=>{compare=!compare;$('serin').setAttribute('aria-pressed',String(compare));render()};for(const id of ['actor','portrait'])$(id).onerror=()=>{$('errors').textContent='이미지 로딩 실패: '+$(id).alt};
for(const p of flags.flags){const card=document.createElement('article');card.className='flag';const img=document.createElement('img');img.src='../'+p.path;img.alt=p.name+' 깃발';const label=document.createElement('p');label.textContent=p.name;const crest=document.createElement('p');crest.textContent=typeof p.crest==='string'?p.crest:JSON.stringify(p.crest);const a=document.createElement('a');a.href='../'+p.path;a.textContent='투명 PNG';card.append(img,label,crest,a);$('flags').append(card)}
for(const [id,showFlags] of [['characters',false],['heraldry',true]])$(id).onclick=()=>{$('flag-panel').hidden=!showFlags;$('character-panel').hidden=showFlags;$('characters').setAttribute('aria-pressed',String(!showFlags));$('heraldry').setAttribute('aria-pressed',String(showFlags))};options();
</script></html>
