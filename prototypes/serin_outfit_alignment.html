<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>세린 · 복장 비율 비교</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#15232e;color:#edf4f5;font:16px system-ui,sans-serif}main{max-width:1100px;margin:auto;padding:24px}h1{font-size:25px;margin:0 0 8px}p{color:#bdd0d6;line-height:1.6}.buttons{display:flex;gap:8px;margin:18px 0}button{font:inherit;padding:10px 24px;border:1px solid #6b858e;border-radius:8px;background:#29404d;color:white;cursor:pointer}button[aria-pressed=true]{background:#f1d8a1;color:#15232e}.stage{position:relative;height:min(720px,75vh);min-height:460px;border-radius:14px;overflow:hidden;background:#8ca5a0}.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.person{position:absolute;left:50%;bottom:0;transform:translateX(-50%);height:100%;width:auto;max-width:100%;object-fit:contain;visibility:hidden}.person.current{visibility:visible}.guide{position:absolute;left:0;right:0;border-top:1px dashed #fff9;pointer-events:none}.guide span{background:#18323bd9;padding:3px 8px;font-size:11px}.top{top:12.6%}.face{top:23.1%}.feet{top:91.4%}.caption{position:absolute;bottom:15px;left:18px;background:#142b37dd;border:1px solid #b8c9cc88;border-radius:10px;padding:10px 16px;pointer-events:none}label{font-size:13px;color:#c0d6da}.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:20px}.tile{background:#d8e9e7;border-radius:10px;overflow:hidden;color:#20353c;text-align:center}.tile img{display:block;width:100%;height:auto;aspect-ratio:2/3;object-fit:contain}.tile b{display:block;padding:10px}#status{font-size:12px;color:#b2c8d1} @media(max-width:600px){main{padding:12px}.buttons button{padding:9px 18px}.gallery{gap:4px}.tile b{font-size:12px}}
</style><main><h1>세린 · 복장 비율 비교</h1><p>갑옷·잠옷·평상복을 같은 크기와 위치에서 비교합니다. 표정은 기본형입니다.</p><div class="buttons"><button data-outfit="armor" aria-pressed="true">갑옷</button><button data-outfit="nightwear" aria-pressed="false">잠옷</button><button data-outfit="casual" aria-pressed="false">평상복</button></div><label><input id="guides" type="checkbox" checked> 머리·얼굴·발 기준선</label><p id="status">이미지 확인 중…</p><div class="stage"><img class="bg" alt="써니 빌리지"><img class="person current" data-name="armor" alt="세린 갑옷"><img class="person" data-name="nightwear" alt="세린 잠옷"><img class="person" data-name="casual" alt="세린 평상복"><div class="guide top"><span>머리 상단</span></div><div class="guide face"><span>얼굴 위치</span></div><div class="guide feet"><span>발 하단</span></div><div class="caption">세린 · <b id="outfit-label">갑옷</b></div></div><section class="gallery"><div class="tile"><b>갑옷 기준</b><img data-copy="armor" alt="갑옷 비교"></div><div class="tile"><b>잠옷</b><img data-copy="nightwear" alt="잠옷 비교"></div><div class="tile"><b>평상복</b><img data-copy="casual" alt="평상복 비교"></div></section></main>
<script>
const local=new URLSearchParams(location.search).has('local');
const root=local?'../':'https://cdn.jsdelivr.net/gh/Tmddhdmlc-ux/Ercedia-RPG@main/';
const paths={armor:'assets/characters/main/serin/standing/base.png',nightwear:'assets/characters/main/serin/standing/outfits/nightwear/base.png',casual:'assets/characters/main/serin/standing/outfits/casual/base.png'};
const names={armor:'갑옷',nightwear:'잠옷',casual:'평상복'};
document.querySelector('.bg').src=root+'assets/locations/towns/sunny_village/town_day.png';
for(const img of document.querySelectorAll('[data-name],[data-copy]'))img.src=root+paths[img.dataset.name||img.dataset.copy];
Promise.all(Array.from(document.images).map(img=>img.decode())).then(()=>{document.getElementById('status').textContent='세 복장 로딩 완료 · 공통 캔버스 1024 × 1536';window.imageLoadVerified=true}).catch(()=>{document.getElementById('status').textContent='이미지 로딩 실패 · 연결을 확인해 주세요';window.imageLoadVerified=false});
for(const b of document.querySelectorAll('[data-outfit]'))b.onclick=()=>{for(const i of document.querySelectorAll('.person'))i.classList.toggle('current',i.dataset.name===b.dataset.outfit);for(const btn of document.querySelectorAll('[data-outfit]'))btn.setAttribute('aria-pressed',String(btn===b));document.getElementById('outfit-label').textContent=names[b.dataset.outfit]};
document.getElementById('guides').onchange=e=>{for(const g of document.querySelectorAll('.guide'))g.style.display=e.target.checked?'block':'none'};
</script></html>
