<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>에르세디아 · NPC 첫 배치 검수</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101a28;color:#ebedf4;font:16px system-ui,sans-serif}main{max-width:1280px;margin:auto;padding:24px}h1{font-size:24px}p{color:#bbc5d6;line-height:1.6}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}select,button{font:inherit;padding:12px;border-radius:10px;background:#26344d;color:#fff;border:1px solid #5f708b;min-height:44px}button[aria-pressed=true]{background:#6d532e}.grid{display:grid;grid-template-columns:2fr 1fr;gap:18px}.stage{position:relative;height:620px;border-radius:18px;overflow:hidden;background:#6a735b}.background{position:absolute;width:100%;height:100%;object-fit:cover}.actor{position:absolute;height:100%;width:auto;left:50%;transform:translateX(-50%);bottom:0;max-width:none}.stage.vn .actor{height:220%;bottom:-120%}.dialogue{position:absolute;bottom:16px;left:16px;right:16px;border:1px solid #ccb884;border-radius:12px;background:#142034ec;padding:18px;z-index:2}.dialogue strong{color:#f0d7a0}.dialogue p{margin:8px 0;color:#fff}.portrait{width:100%;height:550px;object-fit:contain;background:repeating-conic-gradient(#25344b 0% 25%,#31415a 0% 50%) 50%/24px 24px;border-radius:18px}.comparison{width:100%;margin-top:24px;border-radius:12px}.meta{font-size:14px;color:#bac8dc}#errors{color:#ffb8a9}.source{display:flex;gap:20px;margin:12px 0}a{color:#d4b875}@media(max-width:700px){main{padding:12px}.grid{grid-template-columns:1fr}.stage{height:560px}.portrait{height:420px}}
</style>
<main><h1>기사단 신규 인물 10명 · 기본형 검수</h1><p>세린의 화풍을 기준으로 제작한 첫 배치 시안입니다. 이름·외형은 roster 기준이며 세부 디자인은 승인 대기입니다. 얼굴 표정은 base만 제작했습니다.</p>
<div class="toolbar"><select id="character" aria-label="캐릭터 선택"></select><button id="vn" aria-pressed="false">대화 구도</button><button id="full" aria-pressed="true">전신 확인</button><button id="serin" aria-pressed="false">세린과 비교</button></div>
<div class="grid"><section><div class="stage" id="stage"><img class="background" src="../assets/locations/towns/sunny_village/town_day.png" alt="써니 빌리지"><img class="actor" id="actor" alt="캐릭터 전신"><div class="dialogue"><strong id="name"></strong><p>기본형 원화 검수 · 대사는 작성하지 않았습니다.</p></div></div><p id="meta" class="meta"></p></section><section><img class="portrait" id="portrait" alt="캐릭터 기본 초상화"><div class="source"><a id="standing-link">전신 PNG</a><a id="portrait-link">초상화 PNG</a></div><p id="errors" role="status"></p></section></div>
<img class="comparison" src="../assets/characters/batches/batch_01/standing_comparison.jpg" alt="신규 캐릭터 10명 전신 비교">
</main>
<script type="module">
const data=await fetch('../assets/characters/batches/batch_01/manifest.json').then(r=>r.json());
const $=id=>document.getElementById(id);let compare=false;
for(const p of data.characters){const o=document.createElement('option');o.value=p.id;o.textContent=p.id+' · '+p.name;$('character').append(o)}
function render(){const p=data.characters.find(p=>p.id===$('character').value);$('actor').src='../'+(compare?'assets/characters/main/serin/standing/base.png':p.assets.standing.path);$('actor').alt=compare?'세린 기준 전신':p.name+' 전신';$('portrait').src='../'+(compare?'assets/characters/main/serin/base_transparent.png':p.assets.portrait.path);$('portrait').alt=compare?'세린 기준 초상화':p.name+' 초상화';$('name').textContent=compare?'세린 · 기준 원화':p.name+' · '+p.affiliation;$('meta').textContent=p.id+' · 전신 1024×1536 · 초상화 1086×1448 · RGBA · 승인 대기';$('standing-link').href='../'+p.assets.standing.path;$('portrait-link').href='../'+p.assets.portrait.path;$('errors').textContent='';}
$('character').onchange=()=>{compare=false;$('serin').setAttribute('aria-pressed','false');render()};$('vn').onclick=()=>{ $('stage').classList.add('vn');$('vn').setAttribute('aria-pressed','true');$('full').setAttribute('aria-pressed','false')};$('full').onclick=()=>{$('stage').classList.remove('vn');$('vn').setAttribute('aria-pressed','false');$('full').setAttribute('aria-pressed','true')};$('serin').onclick=()=>{compare=!compare;$('serin').setAttribute('aria-pressed',String(compare));render()};for(const id of ['actor','portrait'])$(id).onerror=()=>{$('errors').textContent='이미지 로딩 실패: '+$(id).alt};render();
</script></html>
